<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/jeef-website/img/favicon.svg">
  <link rel="stylesheet" href="/jeef-website/styles/style.css">
  <title>Page introuvable | JEEF</title>
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .notfound .code {
      font-family: var(--ff-heading);
      font-size: var(--fs-900);
      font-weight: 700;
      line-height: 1;
      color: var(--clr-prime);
    }
  </style>
</head>

<body>
  <main class="notfound">
    <p class="code">404</p>
    <h1 class="fs-600 letter-spacing-2">Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <a class="btn" href="/jeef-website/">
      <h1 class="fs-200">Retour à l'accueil</h1>
    </a>
  </main>
</body>

</html>
